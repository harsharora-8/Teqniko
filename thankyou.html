<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Query Raised — TeQniko Engineering</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="thankyou-page">

<header class="header">
  <div class="header-inner">
    <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer">
      <div class="logo-icon">⚙</div>
      <div class="logo-text">
        <span class="logo-main">TeQniko</span>
        <span class="logo-sub">ENGINEERING</span>
      </div>
    </div>
  </div>
</header>

<main class="ty-main">
  <div class="ty-card">
    <div class="ty-icon">✅</div>
    <h1>Query <span class="accent">Raised!</span></h1>
    <p class="ty-msg">Your enquiry has been successfully submitted. Our team will review your requirements and contact you within <strong>24 hours</strong>.</p>

    <div class="ty-details" id="tyDetails">
      <!-- Injected by JS -->
    </div>

    <div class="ty-actions">
      <button class="hero-cta" onclick="window.location.href='index.html'">Browse More Products</button>
    </div>

    <div class="ty-contact">
      <p>Need urgent assistance?</p>
      <a href="tel:9910270342">📞 Call: 9910270342</a>
    </div>
  </div>
</main>

<footer class="footer">
  <p>© 2025 TeQniko Engineering, Faridabad. All rights reserved.</p>
</footer>

<script src="script.js"></script>
<script>
  // Show submitted details
  const last = JSON.parse(localStorage.getItem('lastEnquiry') || '{}');
  if (last.name) {
    document.getElementById('tyDetails').innerHTML = `
      <div class="ty-row"><span>Name</span><strong>${last.name}</strong></div>
      <div class="ty-row"><span>Company</span><strong>${last.company}</strong></div>
      <div class="ty-row"><span>Phone</span><strong>${last.phone}</strong></div>
      <div class="ty-row"><span>Products</span><strong>${last.products}</strong></div>
      <div class="ty-row"><span>Query ID</span><strong>${last.queryId}</strong></div>
    `;
  }
</script>
</body>
</html>
